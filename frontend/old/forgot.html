<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>修改密码</title>
    <!-- 必选依赖：先Vue 后ElementUI -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Microsoft YaHei",sans-serif;
        }
        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#409EFF,#66b1ff);
            padding:20px;
        }
        .login-wrapper{
            width:100%;
            max-width:900px;
        }
        .main-title{
            text-align:center;
            color:#ffffff;
            font-size:34px;
            font-weight:bold;
            margin-bottom:25px;
            letter-spacing:2px;
        }
        .forgot-container{
            background:#ffffff;
            border-radius:16px 16px 0 0;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            display:flex;
        }
        .left-panel{
            width:50%;
            padding:40px;
            display:flex;
            flex-direction:column;
            gap:25px;
        }
        .right-panel{
            width:50%;
            padding:40px;
            display:flex;
            flex-direction:column;
            gap:25px;
        }
        .el-input__inner{
            height:50px;
            border-radius:10px;
            font-size:16px;
        }
        .bottom-container{
            display:flex;
            background:#ffffff;
            border-top:1px solid #eeeeee;
            border-radius:0 0 16px 16px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }
        .bottom-btn{
            flex:1;
            height:60px;
            border:none;
            background:#909399;
            color:#ffffff;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }
        .reset-btn{
            background:#409EFF;
        }
        .bottom-btn:hover{
            opacity:0.9;
        }
        .bottom-btn:first-child{
            border-right:1px solid rgba(255,255,255,0.2);
        }
        @media screen and (max-width:800px){
            .forgot-container{
                flex-direction:column;
            }
            .left-panel,.right-panel{
                width:100%;
                padding:30px;
            }
            .bottom-container{
                flex-direction:column;
            }
            .bottom-btn{
                width:100%;
                height:60px !important;
                flex: none;
            }
            .bottom-btn:first-child{
                border-right:none;
                border-bottom:1px solid rgba(255,255,255,0.2);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-wrapper">
            <div class="main-title">修改密码</div>

            <div class="forgot-container">
                <!-- 修正表单结构：仅包裹输入框，不破坏布局 -->
                <el-form ref="forgotForm" :model="form" :rules="rules" label-width="0" style="display:flex; width:100%">
                    <!-- 左侧：用户名+旧密码 -->
                    <div class="left-panel">
                        <el-form-item prop="username">
                            <el-input placeholder="请输入用户名" v-model="form.username" prefix-icon="el-icon-user"></el-input>
                        </el-form-item>
                        <el-form-item prop="oldPassword">
                            <el-input placeholder="请输入旧密码" v-model="form.oldPassword" show-password prefix-icon="el-icon-lock"></el-input>
                        </el-form-item>
                    </div>

                    <!-- 右侧：新密码+确认密码 -->
                    <div class="right-panel">
                        <el-form-item prop="newPassword">
                            <el-input placeholder="请输入新密码" v-model="form.newPassword" show-password prefix-icon="el-icon-lock"></el-input>
                        </el-form-item>
                        <el-form-item prop="confirmPassword">
                            <el-input placeholder="请确认新密码" v-model="form.confirmPassword" show-password prefix-icon="el-icon-lock"></el-input>
                        </el-form-item>
                    </div>
                </el-form>
            </div>

            <!-- 底部按钮（独立结构，点击100%生效） -->
            <div class="bottom-container">
                <button class="bottom-btn reset-btn" @click="submit">修改密码</button>
                <button class="bottom-btn" @click="goLogin">返回登录</button>
            </div>
        </div>
    </div>

    <script src="js/forgot.js"></script>
</body>
</html>
